<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CertGen — Bulk Certificate Generator</title>
  <meta name="description" content="Generate beautiful PDF certificates for any event or course in bulk. Fast, reliable, and easy to use.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:         #0d0f17;
      --surface:    #141720;
      --surface-2:  #1c2030;
      --border:     rgba(255,255,255,.08);
      --border-2:   rgba(255,255,255,.14);
      --accent:     #6c63ff;
      --accent-2:   #a78bfa;
      --success:    #22c55e;
      --danger:     #f87171;
      --warning:    #fbbf24;
      --muted:      #64748b;
      --text:       #e2e8f0;
      --text-sub:   #94a3b8;
      --radius:     14px;
      --radius-sm:  8px;
      --shadow:     0 8px 32px rgba(0,0,0,.5);
      --glow:       0 0 40px rgba(108,99,255,.18);
    }

    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 16px 60px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(108,99,255,.15) 0%, transparent 70%);
    }

    /* ── Top bar ── */
    header {
      max-width: 820px;
      margin: 0 auto;
      padding: 36px 0 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(108,99,255,.4);
      flex-shrink: 0;
    }
    .brand h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
    .brand p  { font-size: .8rem; color: var(--text-sub); margin-top: 1px; }

    /* ── Cards / glass panels ── */
    .card {
      max-width: 820px;
      margin: 18px auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
      transition: border-color .25s;
    }
    .card:hover { border-color: var(--border-2); }
    .card-title {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Form fields ── */
    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      letter-spacing: .01em;
    }
    label span.tag {
      background: rgba(108,99,255,.15);
      color: var(--accent-2);
      font-size: .7rem;
      font-weight: 500;
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 6px;
    }
    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 11px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font: inherit;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      appearance: none;
    }
    input[type="text"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,.18);
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(.6);
      cursor: pointer;
    }
    textarea {
      height: 160px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: .83rem;
      resize: vertical;
      line-height: 1.6;
    }

    /* ── File drop zone ── */
    .file-zone {
      border: 1.5px dashed var(--border-2);
      border-radius: var(--radius-sm);
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .file-zone:hover, .file-zone.over {
      border-color: var(--accent);
      background: rgba(108,99,255,.06);
    }
    .file-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .file-zone .fz-icon { font-size: 1.6rem; margin-bottom: 6px; opacity: .7; }
    .file-zone .fz-text { font-size: .8rem; color: var(--text-sub); }
    .file-zone .fz-text strong { color: var(--accent-2); }
    #fileLabel { font-size: .75rem; color: var(--success); margin-top: 6px; }

    /* ── Divider ── */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--muted); font-size: .75rem; font-weight: 500;
      margin: 18px 0;
    }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Primary button ── */
    #submit {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .01em;
      box-shadow: 0 4px 18px rgba(108,99,255,.35);
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    #submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(108,99,255,.5);
    }
    #submit:active:not(:disabled) { transform: translateY(0); }
    #submit:disabled {
      opacity: .5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    #submit.loading .spinner { display: block; }
    #submit.loading .btn-label { opacity: .7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    #error {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(248,113,113,.1);
      border: 1px solid rgba(248,113,113,.25);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--danger);
      font-size: .85rem;
      margin-top: 14px;
    }
    #error.visible { display: flex; }

    /* ── Result card ── */
    #result { display: none; }
    #result.visible { display: block; }
    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .job-meta { font-size: .85rem; color: var(--text-sub); }
    .job-meta strong { color: var(--text); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .status-badge.pending, .status-badge.processing {
      background: rgba(251,191,36,.12);
      color: var(--warning);
    }
    .status-badge.completed {
      background: rgba(34,197,94,.12);
      color: var(--success);
    }
    .status-badge.failed, .status-badge.completed_with_errors {
      background: rgba(248,113,113,.12);
      color: var(--danger);
    }
    .pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .5; transform: scale(.6); }
    }

    /* ── Progress bar ── */
    .progress-wrap { margin: 14px 0; }
    .progress-info {
      display: flex; justify-content: space-between;
      font-size: .75rem; color: var(--text-sub);
      margin-bottom: 6px;
    }
    .bar {
      height: 8px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 99px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    /* ── Stat pills ── */
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface-2);
    }
    .stat-pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
    }

    /* ── ZIP download button ── */
    #zip {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.25);
      color: var(--success);
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 20px;
      transition: background .2s;
    }
    #zip:hover { background: rgba(34,197,94,.2); }
    #zip.visible { display: inline-flex; }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .83rem;
    }
    thead tr {
      background: var(--surface-2);
    }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-sub);
    }
    td {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: rgba(255,255,255,.025); }

    /* ── Status cells ── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 600;
    }
    .chip.completed { background: rgba(34,197,94,.12); color: var(--success); }
    .chip.failed    { background: rgba(248,113,113,.12); color: var(--danger); }
    .chip.pending   { background: rgba(100,116,139,.12); color: var(--muted); }

    .dl-link {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 500;
      font-size: .8rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color .15s;
    }
    .dl-link:hover { color: #fff; }

    .err-text { color: var(--danger); font-size: .78rem; }

    /* ── Footer ── */
    footer {
      max-width: 820px;
      margin: 40px auto 0;
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo" aria-hidden="true">🎓</div>
  <div class="brand">
    <h1>CertGen</h1>
    <p>Bulk Certificate Generator</p>
  </div>
</header>

<!-- ── Input card ── -->
<section class="card" aria-label="Certificate generation form">
  <div class="card-title">Job Details</div>

  <div class="field">
    <label for="event">Event / Course Name</label>
    <input type="text" id="event" value="Python Workshop" placeholder="e.g. Advanced Python Workshop 2026">
  </div>

  <div class="field">
    <label for="date">Issue Date <span class="tag">optional</span></label>
    <input type="date" id="date">
  </div>

  <div class="field">
    <label for="recipients">
      Recipients
      <span class="tag">one per line · name, email</span>
    </label>
    <textarea id="recipients" spellcheck="false">Asha Rao, asha@example.com
Ben Lee, ben@example.com
Bad Row, not-an-email</textarea>
  </div>

  <div class="or-divider">or upload a file</div>

  <div class="field">
    <div class="file-zone" id="dropZone" role="button" tabindex="0" aria-label="Upload CSV file">
      <input type="file" id="file" accept=".csv,.txt" aria-label="Choose CSV file">
      <div class="fz-icon">📂</div>
      <div class="fz-text"><strong>Click to browse</strong> or drag &amp; drop a CSV</div>
      <div id="fileLabel"></div>
    </div>
  </div>

  <button id="submit">
    <div class="spinner" aria-hidden="true"></div>
    <span class="btn-label">Generate Certificates</span>
  </button>

  <div id="error" role="alert">
    <span aria-hidden="true">⚠️</span>
    <span id="errorMsg"></span>
  </div>
</section>

<!-- ── Result card ── -->
<section class="card" id="result" aria-live="polite" aria-label="Job results">
  <div class="card-title">Job Results</div>

  <div class="result-header">
    <div class="job-meta">
      Job <strong>#<span id="jobId">–</span></strong>
      &nbsp;·&nbsp;
      Event: <strong id="eventName">–</strong>
    </div>
    <span class="status-badge" id="statusBadge">
      <span class="pulse" aria-hidden="true"></span>
      <span id="statusText">–</span>
    </span>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="progressLabel">Generating…</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <a id="zip" href="#" download aria-label="Download all certificates as ZIP">
    ⬇ Download All (ZIP)
  </a>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>

<footer>
  <p>CertGen &mdash; powered by FastAPI &amp; ReportLab</p>
</footer>

<script>
const $ = id => document.getElementById(id);

// If opened directly from disk (file://), point to the local dev server.
const API = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';

// ── Utilities ──────────────────────────────────────────────────────────────

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function parseRecipients(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const i = line.lastIndexOf(',');
    if (i === -1) return { name: line };
    return { name: line.slice(0, i).trim(), email: line.slice(i + 1).trim() };
  });
}

function showError(msg) {
  $('errorMsg').textContent = msg;
  $('error').classList.add('visible');
}
function clearError() {
  $('error').classList.remove('visible');
}

// ── File drop-zone ─────────────────────────────────────────────────────────

const dropZone = $('dropZone');

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  $('recipients').value = (await f.text()).trim();
  $('fileLabel').textContent = `✓ Loaded: ${f.name}`;
});

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', async e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) {
    $('recipients').value = (await f.text()).trim();
    $('fileLabel').textContent = `✓ Loaded: ${f.name}`;
  }
});
dropZone.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') $('file').click();
});

// ── Submit ─────────────────────────────────────────────────────────────────

$('submit').addEventListener('click', async () => {
  clearError();
  const eventVal = $('event').value.trim();
  if (!eventVal) { showError('Event name is required.'); return; }

  const recText = $('recipients').value.trim();
  if (!recText) { showError('Please add at least one recipient.'); return; }

  const body = {
    event_name: eventVal,
    recipients: parseRecipients(recText),
  };
  if ($('date').value) body.issued_on = $('date').value;

  const btn = $('submit');
  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const res = await fetch(`${API}/jobs`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = Array.isArray(data.detail)
        ? data.detail.map(d => d.loc.slice(1).join('.') + ': ' + d.msg).join('; ')
        : data.detail;
      throw new Error(msg);
    }
    $('result').classList.add('visible');
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    poll(data.job_id);
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.classList.remove('loading');
  }
});

// ── Polling ────────────────────────────────────────────────────────────────

async function poll(jobId) {
  try {
    const job = await (await fetch(`${API}/jobs/${jobId}`)).json();
    render(job);
    if (job.status === 'pending' || job.status === 'processing') {
      setTimeout(() => poll(jobId), 1000);
    } else {
      const btn = $('submit');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  } catch {
    setTimeout(() => poll(jobId), 2000);
  }
}

// ── Render ─────────────────────────────────────────────────────────────────

function statusClass(s) {
  if (s === 'completed') return 'completed';
  if (s === 'failed' || s === 'completed_with_errors') return 'failed';
  return 'pending';
}

function render(job) {
  $('jobId').textContent = job.job_id;
  $('eventName').textContent = job.event_name ?? '–';

  // Status badge
  const badge = $('statusBadge');
  badge.className = 'status-badge ' + statusClass(job.status);
  $('statusText').textContent = job.status.replace(/_/g, ' ');

  // Progress
  const pct = job.progress_percent;
  $('barFill').style.width = pct + '%';
  $('progressPct').textContent = pct + '%';
  const bar = document.querySelector('.bar');
  bar.setAttribute('aria-valuenow', pct);

  const finished = job.status !== 'pending' && job.status !== 'processing';
  $('progressLabel').textContent = finished ? 'Complete' : 'Generating certificates…';

  // Stats pills
  const stats = [
    { label: 'Total',     val: job.total,     color: '#94a3b8' },
    { label: 'Done',      val: job.completed, color: '#22c55e' },
    { label: 'Failed',    val: job.failed,    color: '#f87171' },
    { label: 'Pending',   val: job.pending,   color: '#fbbf24' },
  ];
  $('stats').innerHTML = stats.map(s => `
    <div class="stat-pill">
      <span class="dot" style="background:${s.color}"></span>
      ${s.label}: <strong>${s.val}</strong>
    </div>`).join('');

  // ZIP link
  const zip = $('zip');
  if (finished && job.completed > 0) {
    zip.href = `${API}/jobs/${job.job_id}/download`;
    zip.classList.add('visible');
  } else {
    zip.classList.remove('visible');
  }

  // Table rows
  $('rows').innerHTML = job.certificates.map(c => `
    <tr>
      <td>${c.index + 1}</td>
      <td>${esc(c.name)}</td>
      <td>${esc(c.email)}</td>
      <td><span class="chip ${c.status}">${c.status}</span></td>
      <td>${c.download_url
        ? `<a class="dl-link" href="${API}${c.download_url}" target="_blank" rel="noopener">⬇ PDF</a>`
        : `<span class="err-text">${esc(c.error)}</span>`
      }</td>
    </tr>`).join('');
}
</script>
</body>
</html>
